<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Route — من أول 0 لحد أول وظيفة</title>
<meta name="description" content="Route — كورسات برمجة عملية بمشاريع حقيقية ومينتورز شغالين في السوق.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --primary:#00298E; --primary-deep:#001F6B;
  --cyan:#1AA0DB; --cyan-ink:#0A6FA3; --cyan-soft:#E6F4FB; --sky:#7FD3F5;
  --ink:#0E1320; --body:#4A5366; --muted:#5A6378;
  --line:#E4E7EE; --line-2:#D5DAE4; --soft:#EEF3FF; --grid:#EEF1F6; --dim:#DCE2EE;
  --bg:#FFFFFF;
  /* Alternating section background. Previous value: --alt:#F9FAFD; --alt-line:#E4E7EE */
  --pill:#0B78B8;
  --alt:#E9F4FF; --alt-line:#D3E6FA;
  --mono:var(--font);
  --font:'IBM Plex Sans Arabic','Urbanist',Tahoma,'Segoe UI',sans-serif;
  --pad:80px; --cell:36px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html[lang="en"]{--font:'Urbanist','IBM Plex Sans Arabic','Segoe UI',Helvetica,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(100px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{max-width:1440px;margin-inline:auto;padding-inline:var(--pad)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25;color:var(--ink)}
html[lang="en"] h1,html[lang="en"] h2{letter-spacing:-.02em;line-height:1.12}
p{margin:0}
.mono{font-family:var(--mono)}
.arrow{width:20px;height:20px;flex-shrink:0}
html[dir="rtl"] .arrow{transform:scaleX(-1)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:56px;padding-inline:28px;border-radius:999px;font-size:17px;font-weight:600;text-decoration:none;white-space:nowrap;border:1px solid transparent;transition:background .15s,color .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-deep)}
.btn-outline{border-color:var(--primary);color:var(--primary);background:#fff}
.btn-outline:hover{background:var(--soft)}
.btn-sm{height:44px;padding-inline:20px;font-size:15px}
.link{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:600;text-decoration:none;color:var(--primary)}
.link:hover{text-decoration:underline;text-underline-offset:5px}

/* header: full-width at top, shrinks into a floating pill on scroll */
.site-header{position:sticky;top:0;z-index:20;padding:12px var(--pad) 0;margin-bottom:-96px;pointer-events:none}
.nav-pill{pointer-events:auto;max-width:1280px;margin:0 auto;height:84px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding-inline:0;background:transparent;border:1px solid transparent;border-radius:999px;transition:max-width .45s cubic-bezier(.2,.7,.2,1),height .35s,padding .35s,background .35s,border-color .35s,margin .35s}
.site-header.scrolled .nav-pill{max-width:960px;height:68px;padding-inline:28px 8px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.logo{justify-self:start;display:flex;align-items:center;color:var(--primary);text-decoration:none;min-height:44px}
.logo svg{display:block;height:30px;width:auto;transition:height .35s}
.site-header.scrolled .logo svg{height:24px}
.nav{display:flex;gap:32px;font-size:16px;font-weight:500}
.nav a{text-decoration:none;color:var(--ink);padding-block:10px;white-space:nowrap;position:relative;transition:color .2s}
.nav a:hover,.nav a.active{color:var(--primary)}
.nav a::after{content:"";position:absolute;inset-inline:0;bottom:2px;height:2px;border-radius:2px;background:var(--primary);transform:scaleX(0);transition:transform .25s}
.nav a.active::after{transform:scaleX(1)}
.site-header.scrolled .nav{gap:26px;font-size:15px}
.actions{justify-self:end;display:flex;align-items:center;gap:8px}
.site-header.scrolled .login{display:none}
.lang{height:44px;padding-inline:14px;border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:14px;font-weight:600}
.lang:hover{border-color:var(--primary);color:var(--primary)}
.login{text-decoration:none;font-size:15px;padding-inline:12px;height:44px;display:flex;align-items:center}
.site-header.scrolled .btn-sm{height:50px;padding-inline:24px}
.menu-btn{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:#fff;color:var(--ink);align-items:center;justify-content:center}
.mobile-nav{pointer-events:auto;display:none;position:absolute;top:100%;left:var(--pad);right:var(--pad);max-width:1280px;margin:8px auto 0;padding:12px 20px;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:24px}
.mobile-nav a{min-height:48px;display:flex;align-items:center;text-decoration:none;font-size:17px}
.mobile-nav.open{display:flex}

.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:var(--cyan-soft);color:var(--cyan-ink);font-size:14px;font-weight:500}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--cyan)}
.hero h1{font-size:clamp(40px,5vw,68px)}
.zero{font-family:var(--mono);color:var(--primary)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.role{display:inline-block;color:var(--primary);font-size:.8em;white-space:nowrap;transition:opacity .3s,transform .3s}
.role.out{opacity:0;transform:translateY(-.35em)}
.role.in{opacity:0;transform:translateY(.35em);transition:none}
.hero-copy>p{font-size:20px;color:var(--body);max-width:580px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:40px;padding-top:28px;margin-top:4px;border-top:1px solid var(--line);max-width:600px}
.stats b{font-variant-numeric:tabular-nums;display:block;font-family:var(--mono);font-size:30px;font-weight:700;line-height:1.3}
.stats span{font-size:14px;color:var(--muted)}
.hero-art{flex:0 1 600px;min-width:0;margin-inline-end:-24px}
.hero-art img{display:block;width:100%;height:auto}

/* sections */
.alt{background:var(--alt)}
.alt .eyebrow,.alt .note,.alt .filter-bar{background:#fff}
.section{padding-block:112px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:48px;margin-bottom:48px}
.section-head>div{display:flex;flex-direction:column;gap:16px;max-width:780px}
.eyebrow{align-self:flex-start;padding:6px 16px;border-radius:999px;background:var(--cyan-soft);color:var(--cyan-ink);font-size:14px;font-weight:600;line-height:1.4;transform:rotate(-4deg);transform-origin:center;margin-bottom:4px}
html[dir="rtl"] .eyebrow{transform:rotate(4deg)}
.section h2{font-size:clamp(32px,3.4vw,48px)}
.lead{font-size:18px;color:var(--body)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px}

.centered-head .section-head{justify-content:center;align-items:center;text-align:center}
.centered-head .section-head>div{align-items:center;max-width:none}
#tracks .section-head h2{white-space:nowrap}
#tracks .section-head .lead{max-width:720px}
.centered-head .eyebrow{align-self:center}

.ribbon{position:relative;height:max(260px,18vw);overflow:hidden;margin-block:-64px}
.band{position:absolute;left:-10%;width:120%;top:calc(50% - 34px);height:68px;display:flex;align-items:center;overflow:hidden;background:var(--primary);color:#fff;direction:ltr;transform-origin:57.5% 50%}
.band-a{transform:rotate(4.8deg);z-index:2}
.band-b{transform:rotate(-3.4deg);z-index:1}
.band-track{display:flex;flex-shrink:0;width:max-content;direction:ltr;animation:marquee 70s linear infinite}
.band-b .band-track{animation-direction:reverse;animation-duration:80s}
html[dir="rtl"] .band-a .band-track{animation-direction:reverse}
html[dir="rtl"] .band-b .band-track{animation-direction:normal}
.band:hover .band-track{animation-play-state:paused}
.band-item{display:flex;align-items:center;gap:72px;padding-inline-end:72px;font-size:17px;font-weight:500;white-space:nowrap;letter-spacing:.04em}
html[lang="en"] .band-item{text-transform:uppercase;letter-spacing:.12em;font-size:16px}
.band-item svg{color:#fff;flex-shrink:0}
html[dir="rtl"] .band-b .band-item>span{direction:rtl;unicode-bidi:isolate}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* scroll reveal */
html.rv-on .rv{opacity:0;translate:0 28px;transition:opacity .75s cubic-bezier(.2,.7,.2,1),translate .75s cubic-bezier(.2,.7,.2,1);transition-delay:var(--rvd,0s)}
html.rv-on .rv.in{opacity:1;translate:0 0}
html.rv-on .rv.rv-fade{translate:0 0}
html.rv-on .rv.rv-scale{translate:0 0;scale:.96;transition-property:opacity,scale}
html.rv-on .rv.rv-scale.in{scale:1}

/* partners */
.partners{padding-block:56px}
.partners .label{font-size:16px;color:var(--muted);margin-bottom:24px;text-align:center}
.logos{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:24px 56px}
.logos li{height:48px;display:flex;align-items:center}
.logos img{display:block;width:auto;max-width:180px}

/* tracks */
.filter-bar{display:flex;align-items:center;gap:20px;padding:20px 24px;background:#F6F8FC;border:1px solid var(--line);border-radius:16px;margin-bottom:24px;flex-wrap:wrap}
.filter-bar h3{font-size:18px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.cats{justify-content:center;gap:12px;margin-bottom:32px}
.cats button{min-height:48px;padding-inline:24px}
.chips button{min-height:44px;padding-inline:18px;border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:15px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.tracks{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.tracks>.track{flex:0 0 calc((100% - 48px) / 3);min-width:0}
.track{overflow:hidden;display:flex;flex-direction:column;transition:opacity .2s,border-color .2s}
.track-img{display:block;width:100%;height:auto;aspect-ratio:832/482;object-fit:cover;background:var(--soft);border-bottom:1px solid var(--line)}
.track-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:12px;flex:1}
.facts{list-style:none;margin:0;padding:0;display:flex;gap:20px;flex-wrap:wrap;font-size:15px;color:#2A3142}
.facts li{display:flex;align-items:center;gap:8px}
.facts svg{color:var(--primary)}
.track.dim{opacity:.35}
.track.hot{border-color:var(--primary)}
.track-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.track-id{display:flex;gap:12px;align-items:center}
.track-id .bin{height:40px;padding-inline:12px;border-radius:8px;background:var(--soft);color:var(--primary);font-family:var(--mono);font-size:14px;display:flex;align-items:center}
.track-id .name{font-family:var(--mono);font-size:15px;color:var(--muted)}
.meta{font-size:14px;color:var(--muted)}
.track h3{font-size:22px}
.track p{font-size:16px}
.track p{color:var(--body)}
.stack{display:flex;gap:8px;flex-wrap:wrap;direction:ltr}
html[dir="rtl"] .stack{justify-content:flex-end}
.stack span{height:34px;padding-inline:14px;border-radius:999px;border:1px solid var(--line-2);font-family:var(--mono);font-size:13px;display:flex;align-items:center;color:#2A3142}
.track-foot{margin-top:auto;padding-top:8px}
.track-foot .btn{width:100%}

.all-courses{display:flex;justify-content:center;margin-top:40px}

/* journey: scroll pipeline */
.how-scroll{position:relative;height:calc(100vh + var(--steps,4) * 42vh)}
.how-sticky{position:sticky;top:96px;min-height:calc(100vh - 96px);display:flex;align-items:center;padding-block:40px}
.how-sticky>.wrap{width:100%}
.how-head{display:flex;flex-direction:column;gap:14px;max-width:760px;width:min(100%,640px);margin-bottom:48px}
.how-head h2{font-size:clamp(32px,3.4vw,48px)}
.how-body{display:grid;grid-template-columns:260px minmax(0,1fr);gap:56px;align-items:start}
.how-big{font-size:clamp(120px,13vw,190px);font-weight:800;line-height:.85;color:var(--primary);letter-spacing:-.04em;direction:ltr;text-align:start}
.how-big span{display:inline-block;transition:opacity .25s,transform .25s}
.how-big span.swap{opacity:0;transform:translateY(12px)}
.how-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.how-item{border-bottom:1px solid var(--line)}
.how-item button{width:100%;background:none;border:0;padding:22px 0;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px 16px;align-items:baseline;text-align:start;color:inherit;cursor:pointer}
.how-num{font-family:var(--mono);font-size:13px;color:#7A8294}
.how-t{font-size:26px;font-weight:600;color:#7A8294;line-height:1.3;transition:color .3s}
.how-meta{font-family:var(--mono);font-size:13px;color:#7A8294;white-space:nowrap;unicode-bidi:plaintext}
html[lang="ar"] .how-meta{font-family:var(--font);font-size:14px;text-align:right}
.how-d{grid-column:2 / 4;display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.how-d>p{overflow:hidden;margin:0;color:var(--body);font-size:16px;max-width:560px}
.how-item.on .how-t{color:var(--ink)}
.how-item.on .how-num{color:var(--primary)}
.how-item.on .how-meta{color:var(--primary)}
.how-item.on .how-d{grid-template-rows:1fr}
.how-item.on .how-d>p{padding-top:8px}
.how-bar{height:3px;background:var(--line);margin-top:-1px;border-radius:3px;overflow:hidden}
.how-bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .15s linear}
.how-note{margin-top:40px;color:var(--muted);font-size:15px;max-width:720px;margin-inline-start:316px}
.note{display:flex;gap:16px;align-items:center;margin:64px auto 0;max-width:980px;padding:20px 24px;background:#F6F8FC;border:1px solid var(--line);border-radius:16px;color:#2A3142}
.note .mono{color:var(--primary)}

/* projects */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.project{overflow:hidden;display:flex;flex-direction:column}
.shot{height:250px;background:var(--soft);display:flex;flex-direction:column}
.shot .bar{height:36px;padding-inline:14px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);direction:ltr}
.shot .bar i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.shot .ph{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
.project .body{padding:24px;display:flex;flex-direction:column;gap:10px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tag{height:28px;padding-inline:10px;border-radius:999px;background:var(--soft);color:var(--primary);font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center;white-space:nowrap}
.project h3{font-size:20px}
.sub{font-size:15px;color:var(--muted)}
.links{display:flex;gap:20px}

/* stories */
.poster{margin:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#fff}
.poster img{display:block;width:100%;height:auto;aspect-ratio:4/5}
.story{overflow:hidden;display:flex;flex-direction:column}
.story-img{display:block;width:100%;height:auto;aspect-ratio:545/600;object-fit:cover;object-position:top;background:#fff}
.story-body{padding:28px 32px 32px;display:flex;flex-direction:column;gap:20px;flex:1}
.route-to{align-self:flex-start;padding:6px 12px;background:var(--primary);color:#fff;font-weight:700;font-size:15px;line-height:1.4;border-radius:6px}
.person{justify-content:space-between;flex-wrap:wrap}
.person{display:flex;gap:16px;align-items:center}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--dim);flex-shrink:0}
.person h3{font-size:20px}
.ba{display:flex;flex-direction:column;gap:10px}
.ba div{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:#F6F8FC}
.ba div.after{background:#fff;border:1px solid var(--primary)}
.ba b{width:32px;height:32px;border-radius:8px;background:var(--line);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ba .after b{background:var(--primary);color:#fff}
.ba small{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.ba span{font-size:16px;line-height:1.5}
blockquote{margin:0;font-size:17px;color:#2A3142}

/* mentors */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.mentor{display:flex;flex-direction:column;gap:16px}
.photo{height:320px;border-radius:20px;background:var(--soft);border:1px solid var(--line);position:relative;overflow:hidden}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.photo .tag{position:absolute;top:16px;inset-inline-start:16px;background:#fff}
.mentor h3{font-size:20px}

/* reviews */
.reel-stage{position:relative;height:640px;margin-top:8px}
.rs-card{position:absolute;top:0;left:50%;width:340px;margin-left:-170px;aspect-ratio:9/16;border-radius:24px;overflow:hidden;background:var(--primary);color:#fff;transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .55s,box-shadow .55s;will-change:transform}
.rs-card.active{box-shadow:0 30px 60px -20px rgba(0,30,110,.55),0 0 0 4px #fff,0 0 0 6px var(--primary)}
.rs-card video,.rs-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rs-hit{position:absolute;inset:0;border:0;background:transparent;padding:0;cursor:pointer;color:inherit;border-radius:24px}
.rs-ph{position:absolute;top:50%;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.75);transform:translateY(56px);padding-inline:16px}
.rs-prog{position:absolute;top:14px;inset-inline:14px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden;opacity:0;transition:opacity .3s}
.rs-card.active .rs-prog{opacity:1}
.rs-prog i{display:block;height:100%;width:0;background:#fff;border-radius:4px}
.rs-card .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;transition:opacity .25s,transform .25s}
.rs-card.active.playing .play{opacity:0;transform:translate(-50%,-50%) scale(.8)}
.rs-who{position:absolute;inset-inline:0;bottom:0;padding:56px 20px 20px;background:linear-gradient(to top,rgba(0,10,40,.85),rgba(0,10,40,0));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.rs-who b{font-size:18px;font-weight:600;line-height:1.3}
.rs-who .tag{align-self:flex-start;background:rgba(255,255,255,.18);color:#fff}
.rs-sound{position:absolute;top:30px;inset-inline-end:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:none;align-items:center;justify-content:center}
.rs-card.active.has-video .rs-sound{display:flex}
.rs-sound .on{display:none}
.rs-sound[aria-pressed="true"] .on{display:block}
.rs-sound[aria-pressed="true"] .off{display:none}
.reel-controls{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:28px}
.rc-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line-2);background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center}
.rc-btn:hover{border-color:var(--primary)}
.rc-dots{display:flex;gap:8px}
.rc-dots button{width:10px;height:10px;border-radius:999px;border:0;padding:0;background:var(--line-2);transition:width .3s,background .3s;position:relative}
.rc-dots button::after{content:"";position:absolute;inset:-17px -4px}
.rc-dots button[aria-current="true"]{width:28px;background:var(--primary)}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.reel:hover .play{transform:translate(-50%,-50%) scale(1.06)}
.reel .who{position:absolute;inset-inline:0;bottom:0;padding:48px 18px 18px;background:linear-gradient(to top,rgba(0,10,40,.8),rgba(0,10,40,0));display:flex;flex-direction:column;gap:6px}
.reel .who b{font-size:17px;font-weight:600;line-height:1.3}
.reel .who .tag{align-self:flex-start;background:rgba(255,255,255,.18);color:#fff}
.play{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,20,80,.35);transition:transform .15s}
.quotes{margin-top:24px}
.qcard{padding:28px;display:flex;flex-direction:column;gap:20px}
.qcard blockquote{font-size:17px;line-height:1.75;color:#2A3142}
.qmark{color:var(--cyan);font-family:var(--mono);font-size:40px;line-height:.6;height:20px}
.qwho{margin-top:auto;display:flex;align-items:center;gap:12px}
.qwho .avatar{width:44px;height:44px}
.qwho h3{font-size:16px}
.vid-dialog{border:0;border-radius:20px;padding:0;width:min(420px,92vw);max-height:94vh;overflow:hidden}
.vid-dialog::backdrop{background:rgba(8,14,40,.72)}
.vid-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 12px 12px 24px}
html[dir="rtl"] .vid-head{padding:12px 24px 12px 12px}
.vid-head h3{font-size:18px}
.vid-frame .open-src{color:#fff;font-weight:600}
.vid-close{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}
.vid-frame{aspect-ratio:9/16;max-height:calc(94vh - 68px);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.vid-frame iframe,.vid-frame video{width:100%;height:100%;border:0;display:block}
.vid-frame:has(iframe),.vid-frame:has(video){padding:0}

/* app */
.store-badge{display:inline-flex;border-radius:10px}
.store-badge img{display:block;height:54px;width:auto}
.store-badge:hover{opacity:.85}
.app .wrap{position:relative}
.app-grid{display:grid;grid-template-columns:minmax(0,1.15fr) 340px minmax(0,.85fr);gap:48px;align-items:start;min-height:400px;position:relative}
.app-copy{display:flex;flex-direction:column;gap:22px;padding-top:24px}
.app-copy h2{font-size:clamp(30px,3.1vw,44px);white-space:nowrap}
.app-copy .btn svg{flex-shrink:0}
.app-phone{position:relative;z-index:3;height:400px}
.app-phone img{position:absolute;top:0;left:0;width:100%;height:auto;filter:drop-shadow(0 30px 40px rgba(0,20,80,.28))}
.app-info{display:flex;flex-direction:column;gap:16px;padding-top:40px}
.app-stat{display:flex;align-items:center;gap:16px;margin-top:20px}
.faces{display:flex}
.faces img{width:48px;height:48px;border-radius:50%;border:3px solid #fff;object-fit:cover}
.faces img+img{margin-inline-start:-14px}
.app-stat b{font-size:40px;font-weight:600;line-height:1}
.app-block{position:relative;z-index:1;background:var(--primary);color:#fff;border-radius:28px;overflow:hidden;padding:340px 40px 48px;text-align:center}
.app-marquee{position:absolute;top:36px;left:0;right:0;overflow:hidden;direction:ltr}
.app-marquee-track{display:flex;align-items:center;gap:48px;width:max-content;animation:marquee 40s linear infinite}
.app-marquee span{font-size:150px;font-weight:800;line-height:1;letter-spacing:.02em;color:rgba(255,255,255,.14)}
.app-marquee i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2)}
.app-feat-title{position:relative;font-size:19px;color:rgba(255,255,255,.85);margin-bottom:24px}
.app-feats{position:relative;list-style:none;margin:0;padding:0;display:flex;justify-content:center;flex-wrap:wrap;gap:16px 40px}
.app-feats li{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600}
.app-feats .fi{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.stories{overflow:clip}
.wall{display:flex;flex-direction:column;gap:20px;margin-inline:calc(var(--pad) * -1)}
.wall-row{overflow:hidden;direction:ltr}
.wall-track{display:flex;gap:20px;width:max-content;animation:marquee 80s linear infinite;padding-inline:10px}
.wall-row.rev .wall-track{animation-direction:reverse;animation-duration:90s}
html[dir="rtl"] .wall-row .wall-track{animation-direction:reverse}
html[dir="rtl"] .wall-row.rev .wall-track{animation-direction:normal}
.wall:hover .wall-track{animation-play-state:paused}
.wall figure{margin:0;width:280px;flex-shrink:0;border-radius:18px;overflow:hidden;border:1px solid var(--alt-line);background:#fff}
.wall img{display:block;width:100%;height:auto;aspect-ratio:4/5}

/* blog */
.post{overflow:hidden;display:flex;flex-direction:column}
.post-cover{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:var(--soft);border-bottom:1px solid var(--line)}
.post-body{padding:24px;display:flex;flex-direction:column;gap:12px;flex:1}
.post-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.post h3{font-size:21px;line-height:1.4}
.post h3 a{text-decoration:none}
.post h3 a:hover{color:var(--primary)}
.post p{color:var(--body);font-size:16px}
.post .link{margin-top:auto}

html[dir="rtl"] .contact::before{background-position:left -40px center}
.contact .contact-wrap{position:relative;z-index:1}
.contact-wrap{display:flex;gap:80px;align-items:flex-start}
.contact-intro{width:440px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}
.contact-points{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.contact-points li{display:flex;gap:14px;align-items:center}
.cp-ic{width:48px;height:48px;border-radius:14px;background:#fff;border:1px solid var(--alt-line);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contact-points small{display:block;font-size:14px;color:var(--muted);line-height:1.4}
.contact-points a{font-size:18px;font-weight:600;color:var(--ink);text-decoration:none}
.contact-points a:hover{color:var(--primary);text-decoration:underline;text-underline-offset:4px}
.contact-form{flex:1;min-width:0;padding:36px;display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.field label{font-size:15px;font-weight:600;color:var(--ink)}
.opt{font-weight:400;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:52px;padding:12px 16px;border:1px solid var(--line-2);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:16px}
.field textarea{resize:vertical;min-height:120px}
html[dir="rtl"] .field input[dir="ltr"]{text-align:right}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,41,142,.15)}
.field [aria-invalid="true"],.field [aria-invalid="true"]:focus{border-color:#C0262D}
.err{font-size:14px;color:#B3261E;margin:0}
.contact-form .btn{align-self:flex-start;min-width:200px}
.success{display:flex;gap:12px;align-items:center;padding:16px 18px;border-radius:12px;background:#E8F5EE;color:#0F5B34;font-weight:600}
.success[hidden],.err[hidden]{display:none}

/* faq */
.faq .wrap{display:flex;gap:80px;align-items:flex-start}
.faq-intro{width:420px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;position:sticky;top:120px}
.faq-intro .btn{align-self:flex-start;margin-top:8px}
.faq-list{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.qa{border:1px solid var(--line);border-radius:14px;background:#fff}
.qa.open{border-color:var(--primary)}
.qa h3{font-size:18px}
.qa button{width:100%;min-height:64px;padding:12px 24px;background:none;border:0;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:start;font-size:18px;font-weight:600;border-radius:14px}
.qa .ans{padding:0 24px 24px;color:var(--body)}
.qa .ans[hidden]{display:none}
.plus{flex-shrink:0}
.qa.open .plus .v{display:none}

/* final cta + footer */
.final{padding-block:96px 112px}
.final-box{background:var(--primary);color:#fff;border-radius:28px;padding:64px;display:flex;flex-direction:column;align-items:center;gap:32px;text-align:center;overflow:hidden}
.final-box h2{color:#fff;font-size:clamp(32px,3.8vw,52px)}
.final-box .zero{color:var(--sky)}
.final-box .btn-primary{background:#fff;color:var(--primary)}
.final-box .btn-primary:hover{background:var(--soft)}
.final-box .btn-outline{background:transparent;border-color:#fff;color:#fff}
.final-box .btn-outline:hover{background:rgba(255,255,255,.1)}
.strip{direction:ltr;display:flex;flex-direction:column;max-width:100%;overflow:hidden}
.strip .row{display:flex}
.strip .c{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:6px;font-family:var(--mono);font-size:13px;color:#2E4DB8}
.strip .c.p{color:var(--sky);font-weight:700}
.strip .c.start{background:var(--primary-deep);color:#fff}
.strip .c.end{background:var(--sky);color:var(--primary)}
.site-footer{padding-block:96px 40px;overflow:hidden}
.ft-top{display:flex;justify-content:space-between;align-items:flex-start;gap:48px;flex-wrap:wrap}
.ft-brand{display:flex;flex-direction:column;gap:20px;max-width:420px}
.ft-brand .logo svg{height:48px}
.ft-brand p{font-size:20px;color:var(--muted);line-height:1.7}
.ft-contact{display:flex;flex-direction:column;gap:20px;min-width:340px}
.ft-contact a{display:flex;justify-content:space-between;align-items:center;gap:40px;text-decoration:none;color:var(--ink);font-size:32px;font-weight:600}
.ft-contact a:hover{color:var(--primary)}
.ft-contact .ext{flex-shrink:0;width:26px;height:26px;transition:transform .2s}
html[dir="rtl"] .ft-contact a{flex-direction:row}
.ft-contact a:hover .ext{transform:translate(2px,-2px)}
.ft-mid{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap;margin-top:112px}
.ft-links{display:flex;gap:48px;flex-wrap:wrap}
.ft-links a{text-decoration:none;color:var(--ink);font-size:22px;font-weight:600}
.ft-links a:hover{color:var(--primary)}
.ft-social{display:flex;gap:28px}
.ft-social svg{width:52px;height:52px}
.ft-social a{color:var(--primary);display:flex;border-radius:8px}
.ft-social a:hover{opacity:.8}
.ft-mark-wrap{margin-top:72px;direction:ltr;-webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.35) 70%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.35) 70%,transparent 100%)}
.foot-mark{display:block;width:100%;height:auto;color:#E8ECF7}
.ft-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:17px;color:var(--muted)}
.ft-bottom a{color:var(--ink);text-decoration:none}
.ft-bottom a:hover{color:var(--primary)}

/* responsive */
@media (max-width:1180px){
  :root{--pad:40px;--cell:28px}
  .nav{display:none}
  .nav-pill{grid-template-columns:1fr auto}
  .hero-art{flex:0 1 42%}
  .hero .wrap{gap:40px}
  .menu-btn{display:inline-flex}
  .login{display:none}
  .how-body{grid-template-columns:180px minmax(0,1fr);gap:32px}
  .how-note{margin-inline-start:212px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .faq .wrap,.contact-wrap{flex-direction:column;gap:40px}
  .app-grid{grid-template-columns:minmax(0,1fr) 280px;min-height:0}
  .app-copy h2{white-space:normal}
  .app-info{grid-column:1;grid-row:2;padding-top:0}
  .app-phone{grid-column:2;grid-row:1 / span 2;height:360px}
  .app-block{padding-top:260px}
  .app-marquee span{font-size:110px}
  .faq-intro{width:auto;position:static}
  .contact-intro{width:auto}
  .ft-contact a{font-size:24px}
  .ft-social svg{width:44px;height:44px}
  .ft-mid{margin-top:72px}
  .contact-form{width:100%}
}
@media (max-width:900px){
  .hero::before{background-size:auto 55%;background-position:right -30px bottom 20px}
  html[dir="rtl"] .hero::before{background-position:left -30px bottom 20px}
  .hero .wrap{flex-direction:column;align-items:stretch;padding-top:120px;padding-bottom:56px;gap:40px}
  .hero-art{flex:none;align-self:center;width:100%;max-width:460px;margin-inline-end:0}
  .grid3{grid-template-columns:minmax(0,1fr)}
  #tracks .section-head h2{white-space:normal}
  .tracks>.track{flex-basis:calc((100% - 24px) / 2)}
  .section-head{flex-direction:column;align-items:flex-start;gap:20px}
}
@media (max-width:600px){
  .role{font-size:.64em}
  .logo svg{height:24px}
  :root{--pad:20px;--cell:24px}
  body{font-size:16px}
  .section{padding-block:72px}
  .nav-pill{height:64px}
  .site-header{padding-top:8px}
  .site-header.scrolled .nav-pill{height:60px;padding-inline:18px 8px}
  .site-header{margin-bottom:-72px}
  .actions .btn-sm{display:none}
  .hero-copy>p{font-size:17px}
  .cta-row .btn{width:100%}
  .stats{gap:20px}
  .stats b{font-size:22px}
  .stats span{font-size:12px}
  .grid4{grid-template-columns:minmax(0,1fr)}
  .ft-contact{min-width:0;width:100%}
  .ft-contact a{font-size:20px}
  .ft-links{gap:16px 24px}
  .ft-links a{font-size:17px}
  .ft-social{gap:18px}
  .ft-social svg{width:36px;height:36px}
  .ft-brand p{font-size:17px}
  .ft-mid{margin-top:48px}
  .site-footer{padding-block:56px 24px}
  .wall figure{width:200px}
  .wall,.wall-track{gap:14px}
  .how-scroll{height:auto}
  .how-sticky{position:static;min-height:0;padding-block:72px}
  .how-body{grid-template-columns:minmax(0,1fr)}
  .how-big,.how-bar{display:none}
  .how-item button{grid-template-columns:40px minmax(0,1fr);cursor:default}
  .how-meta{grid-column:2;white-space:normal}
  .how-d{grid-column:2;grid-template-rows:1fr}
  .how-d>p{padding-top:6px}
  .how-t{color:var(--ink);font-size:21px}
  .how-num,.how-meta{color:var(--primary)}
  .how-note{margin-inline-start:0}
  .how-head{margin-bottom:28px}
  .app-grid{grid-template-columns:minmax(0,1fr);gap:28px}
  .app-info{grid-column:auto;grid-row:auto;order:2}
  .app-phone{grid-column:auto;grid-row:auto;order:3;width:230px;height:300px;justify-self:center}
  .app-feats{align-self:center;display:inline-flex}
  .store-badge img{height:46px}
  .app-block{padding:210px 20px 32px;margin-top:0}
  .app-marquee span{font-size:80px}
  .app-feats{flex-direction:column;align-items:flex-start;gap:14px}
  .app-feats li{font-size:16px}
  .ribbon{height:150px;margin-block:-24px}
  .band{height:48px;top:calc(50% - 24px)}
  .band-a{transform:rotate(6deg)}
  .band-b{transform:rotate(-5deg)}
  .band-item{font-size:14px;gap:36px;padding-inline-end:36px}
  .reel-stage{height:470px}
  .rs-card{width:250px;margin-left:-125px}
  .logos{gap:20px 36px}
  .track-body,.story-body{padding:20px}
  .field-row{grid-template-columns:minmax(0,1fr)}
  .contact-form{padding:24px}
  .contact-form .btn{width:100%}
  .tracks>.track{flex-basis:100%}
  .final-box{padding:40px 20px}
  .final-box .cta-row{width:100%}
  .filter-bar{padding:16px}
  .photo{height:260px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
  .nav-pill,.logo svg{transition:none}
  .band-track,.app-marquee-track,.wall-track{animation:none}
  .wall-row{overflow-x:auto}
}
</style>

  var state = { lang:'ar', filter:'all', open:0 };
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function $(id){ return document.getElementById(id); }

  function renderTracks(t){
    var chips = '';
    Object.keys(t.filters).forEach(function(k){
      chips += '<button type="button" data-f="'+k+'" aria-pressed="'+(state.filter===k)+'">'+esc(t.filters[k])+'</button>';
    });
    $('chips').innerHTML = chips;
    $('trackList').innerHTML = TRACKS.filter(function(tr){ return state.filter==='all' || state.filter===tr.cat; }).map(function(tr){
      var match = state.filter==='all' || state.filter===tr.cat;
      var cls = 'card track';
      return '<article class="'+cls+'">'+
        '<img class="track-img" src="'+COURSE_IMG+'" alt="'+esc(t.imgAlt)+'" width="832" height="482" loading="lazy" decoding="async">'+
        '<div class="track-body">'+
        '<div class="track-top"><span class="tag" lang="en">'+tr.name+' | '+esc(t.courseWord)+'</span></div>'+
        '<h3 lang="en">'+tr.course+'</h3><p>'+esc(t.trackDesc[tr.id])+'</p>'+
        '<ul class="facts"><li>'+IC_CLOCK+'<span>'+esc(tr.dur[state.lang])+'</span></li><li>'+IC_LEVEL+'<span>'+esc(tr.lvl[state.lang])+'</span></li></ul>'+
        '<div class="stack">'+tr.stack.map(function(s){return '<span>'+esc(s)+'</span>';}).join('')+'</div>'+
        '<div class="track-foot"><a class="btn btn-outline btn-sm" href="course.html?id='+tr.id+'">'+'<span>'+esc(t.details)+'</span>'+ARROW+'</a></div>'+
        '</div>'+
      '</article>';
    }).join('');
  }
  function renderFaq(t){
    $('faqList').innerHTML = t.faqs.map(function(f,i){
      var open = state.open===i;
      return '<div class="qa'+(open?' open':'')+'"><h3><button type="button" data-q="'+i+'" aria-expanded="'+open+'" aria-controls="ans'+i+'"><span>'+esc(f[0])+'</span>'+PLUS+'</button></h3>'+
        '<div class="ans" id="ans'+i+'"'+(open?'':' hidden')+'>'+esc(f[1])+'</div></div>';
    }).join('');
  }
  function render(){
    var t = T[state.lang];
    var html = document.documentElement;
    html.lang = state.lang; html.dir = state.lang==='ar' ? 'rtl' : 'ltr';

  function buildGrid(el, R, C, pts, cls){
    var path = {};
    for (var i=0;i<pts.length-1;i++){
      var r=pts[i][0], c=pts[i][1], r2=pts[i+1][0], c2=pts[i+1][1];
      path[r+','+c]=1;
      while(r!==r2||c!==c2){ if(r!==r2) r+= r2>r?1:-1; else c+= c2>c?1:-1; path[r+','+c]=1; }
    }
    var order = [];
    for (var j=0;j<pts.length-1;j++){
      var a=pts[j][0], b=pts[j][1], a2=pts[j+1][0], b2=pts[j+1][1];
      if(j===0) order.push(a+','+b);
      while(a!==a2||b!==b2){ if(a!==a2) a+= a2>a?1:-1; else b+= b2>b?1:-1; order.push(a+','+b); }
    }
    var start = pts[0].join(','), end = pts[pts.length-1].join(',');
    var h='';
    for (var rr=0; rr<R; rr++){
      h+='<div class="row">';
      for (var cc=0; cc<C; cc++){
        var k=rr+','+cc, on=!!path[k];
        var d = k===start ? '0' : on ? '1' : (((rr*7+cc*13+rr*cc)%5)<2 ? '1' : '0');
        var cl='c'+(on?' p':'')+(k===start?' start':'')+(k===end?' end':'');
        h+='<span class="'+cl+'" data-k="'+k+'">'+d+'</span>';
      }
      h+='</div>';
    }
    el.innerHTML=h;
    return order;
  }

      function step(now){
        var p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
        Array.prototype.forEach.call(els,function(el){ el.textContent=Math.round(e*(+el.dataset.count))+el.dataset.suffix; });
        if(p<1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    setTimeout(run, 500);
  })();

  // events
  $('chips').addEventListener('click', function(e){ var b=e.target.closest('button[data-f]'); if(!b) return; state.filter=b.getAttribute('data-f'); renderTracks(T[state.lang]); var nb=$('chips').querySelector('[data-f="'+state.filter+'"]'); if(nb) nb.focus(); });
  $('faqList').addEventListener('click', function(e){ var b=e.target.closest('button[data-q]'); if(!b) return; var i=+b.getAttribute('data-q'); state.open = state.open===i ? -1 : i; renderFaq(T[state.lang]); var nb=$('faqList').querySelector('[data-q="'+i+'"]'); if(nb) nb.focus(); });
  $('langBtn').addEventListener('click', function(){ state.lang = state.lang==='ar' ? 'en' : 'ar'; try{ localStorage.setItem('route-lang', state.lang); }catch(err){} render(); startRoles(); markReveal(); });
  $('menuBtn').addEventListener('click', function(){ var n=$('mobileNav'); var open=!n.classList.contains('open'); n.classList.toggle('open', open); this.setAttribute('aria-expanded', open); });
  $('mobileNav').addEventListener('click', function(e){ if(e.target.closest('a')){ this.classList.remove('open'); $('menuBtn').setAttribute('aria-expanded','false'); } });

  try{
    var q = new URLSearchParams(location.search).get('lang');
    var saved = localStorage.getItem('route-lang');
    if (q==='en'||q==='ar') state.lang=q; else if (saved==='en'||saved==='ar') state.lang=saved;
  }catch(err){}
  render();
  startRoles();
  markReveal();
  try{ var pc=new URLSearchParams(location.search).get('course'); if(pc){ $('cfCourse').value=pc; } }catch(err){}
})();
</script>
</body>
</html>
