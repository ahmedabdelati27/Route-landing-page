<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تفاصيل الكورس — Route</title>
<meta name="description" content="Route — تفاصيل الكورس، المحتوى، المدة والمستوى.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light;--primary:#00298E;--primary-deep:#001F6B;--cyan:#1AA0DB;--cyan-ink:#0A6FA3;--cyan-soft:#E6F4FB;--ink:#0E1320;--body:#4A5366;--muted:#5A6378;--line:#E4E7EE;--line-2:#D5DAE4;--soft:#EEF3FF;--alt:#E9F4FF;--alt-line:#D3E6FA;--bg:#FFFFFF;
  --font:'IBM Plex Sans Arabic','Urbanist',Tahoma,'Segoe UI',sans-serif;--pad:80px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang="en"]{--font:'Urbanist','IBM Plex Sans Arabic','Segoe UI',Helvetica,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit} button{font:inherit;cursor:pointer} p{margin:0} h1,h2,h3{margin:0;font-weight:600;line-height:1.3}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{max-width:1440px;margin-inline:auto;padding-inline:var(--pad)}
.arrow{width:20px;height:20px;flex-shrink:0} html[dir="rtl"] .arrow{transform:scaleX(-1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding-inline:28px;border-radius:999px;font-size:17px;font-weight:600;text-decoration:none;white-space:nowrap;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-deep)}
.btn-outline{border-color:var(--primary);color:var(--primary);background:#fff}.btn-outline:hover{background:var(--soft)}
.btn-sm{height:44px;padding-inline:20px;font-size:15px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* header */
.site-header{position:sticky;top:0;z-index:20;padding:12px var(--pad) 0;pointer-events:none}
.nav-pill{pointer-events:auto;max-width:1280px;margin:0 auto;height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding-inline:32px 12px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px}
.logo{justify-self:start;display:flex;align-items:center;color:var(--primary);text-decoration:none;min-height:44px}
.logo svg{display:block;height:26px;width:auto}
.nav{display:flex;gap:28px;font-size:15px;font-weight:500}
.nav a{text-decoration:none;color:var(--ink);padding-block:10px;white-space:nowrap}
.nav a:hover,.nav a[aria-current]{color:var(--primary)}
.actions{justify-self:end;display:flex;align-items:center;gap:8px}
.lang{height:44px;padding-inline:14px;border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:14px;font-weight:600}
.lang:hover{border-color:var(--primary);color:var(--primary)}
.menu-btn{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:#fff;color:var(--ink);align-items:center;justify-content:center}
.mobile-nav{pointer-events:auto;display:none;position:absolute;top:100%;left:var(--pad);right:var(--pad);margin-top:8px;padding:12px 20px;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:24px}
.mobile-nav a{min-height:48px;display:flex;align-items:center;text-decoration:none;font-size:17px}
.mobile-nav.open{display:flex}


.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:28px 0 20px;padding:0;list-style:none}
.crumbs a{text-decoration:none;color:var(--muted)} .crumbs a:hover{color:var(--primary)}
.crumbs li+li::before{content:"/";margin-inline-end:8px;color:var(--line-2)}
.crumbs [aria-current]{color:var(--ink);font-weight:600}
.top{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:stretch;margin-top:8px}
.banner{position:relative;display:block;width:100%;height:100%;min-height:360px;border:0;padding:0;border-radius:28px;overflow:hidden;background:#E3EDFB;cursor:pointer}
.banner img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}
.banner .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.94);color:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,20,80,.25);transition:transform .15s}
.banner:hover .play{transform:translate(-50%,-50%) scale(1.06)}
.main{min-width:0;display:flex;flex-direction:column;gap:72px;margin-top:48px}
.tag{display:inline-flex;align-items:center;height:30px;padding-inline:12px;border-radius:999px;background:var(--soft);color:var(--primary);font-size:13px;font-weight:600}
.intro{max-width:860px}
.intro h1{font-size:clamp(32px,3.4vw,48px);margin:14px 0 14px}
.intro p{color:var(--body);font-size:18px}
.stack{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;direction:ltr} html[dir="rtl"] .stack{justify-content:flex-end}
.stack span{height:34px;padding-inline:14px;border-radius:999px;border:1px solid var(--line-2);font-size:14px;display:flex;align-items:center;color:#2A3142}
.sec h2{font-size:28px;margin-bottom:22px}
.mods{display:flex;flex-direction:column;gap:12px}
.mod{border:1px solid var(--line);border-radius:20px;background:#fff;transition:border-color .2s,background .2s}
.mod.open{border-color:var(--alt-line);background:var(--alt)}
.mod h3{font-size:inherit}
.mod-btn{width:100%;min-height:76px;padding:16px 22px;background:none;border:0;display:flex;align-items:center;gap:14px;text-align:start;color:var(--ink);border-radius:20px}
.mod-n{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;transition:background .2s,color .2s}
.mod.open .mod-n{background:var(--primary);color:#fff}
.mod-t{flex:1;min-width:0}
.mod-t small{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.mod-t b{display:block;font-size:19px;font-weight:600;line-height:1.4}
.mod .chev{flex-shrink:0;color:var(--body);transition:transform .25s}
.mod.open .chev{transform:rotate(180deg)}
.mod-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.mod.open .mod-p{grid-template-rows:1fr}
.mod-p>div{overflow:hidden}
.mod ul{margin:0;padding:0 22px 20px;padding-inline-start:78px;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px}
.mod li{position:relative;padding-inline-start:18px;color:#2A3142;font-size:16px}
.mod li::before{content:"";position:absolute;inset-inline-start:0;top:.7em;width:7px;height:7px;border-radius:50%;background:var(--cyan)}
.expand-all{display:inline-flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;color:var(--primary);font-weight:600;font-size:15px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.sec-head h2{margin:0}
.revs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rev{border:1px solid var(--line);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.rev-q{color:var(--cyan);font-size:40px;line-height:.5;height:18px;font-weight:700}
.rev p{color:#2A3142}
.rev-h{display:flex;gap:12px;align-items:center;margin-top:auto}
.av{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700}
.rev-h b{display:block;font-weight:600;line-height:1.3} .rev-h small{color:var(--muted);font-size:13px}
/* sidebar */
.aside{display:flex}
.aside .side{flex:1;display:flex;flex-direction:column}
.aside .side-actions{margin-top:auto}
.side{border:1px solid var(--line);border-radius:24px;padding:28px;background:#fff}
.side h2{font-size:20px;margin-bottom:8px}
.rows{list-style:none;margin:0 0 24px;padding:0}
.rows li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.rows li:last-child{border-bottom:0}
.rows .ic{color:var(--primary);display:flex}
.rows span{color:var(--muted)}
.rows b{margin-inline-start:auto;font-weight:600;text-align:end}
.side .btn{width:100%}
.side-actions{display:flex;flex-direction:column;gap:10px}
.share-wrap{position:relative}
.share-pop{position:absolute;inset-inline:0;top:calc(100% + 8px);z-index:5;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;display:none;flex-direction:column}
.share-pop.open{display:flex}
.share-pop a,.share-pop button{display:flex;align-items:center;gap:12px;min-height:46px;padding-inline:14px;border-radius:12px;text-decoration:none;color:var(--ink);font-size:15px;background:none;border:0;text-align:start;width:100%}
.share-pop a:hover,.share-pop button:hover{background:var(--soft)}
.share-pop svg{flex-shrink:0;color:var(--primary)}
.toast{position:fixed;bottom:24px;left:50%;translate:-50% 20px;opacity:0;z-index:40;background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;transition:opacity .25s,translate .25s;pointer-events:none}
.toast.show{opacity:1;translate:-50% 0}
/* full width sections */
.full{margin-top:96px}
.full>h2{font-size:32px;margin-bottom:24px}
.infos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.info{background:var(--alt);border-radius:22px;padding:28px}
.info .ic{width:48px;height:48px;border-radius:14px;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.info h3{font-size:20px;margin-bottom:8px}
.info p{color:var(--body);font-size:16px}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.why div{border:1px solid var(--line);border-radius:22px;padding:24px}
.why .wic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.why b{display:block;font-size:17px;font-weight:600;margin-bottom:4px}
.why p{font-size:15px;color:var(--body)}
.moments{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.moments img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:20px}
.faq{display:flex;flex-direction:column;gap:10px;max-width:900px}
.qa{border:1px solid var(--line);border-radius:18px}
.qa.open{border-color:var(--primary)}
.qa h3{font-size:inherit}
.qa button{width:100%;min-height:68px;padding:14px 22px;background:none;border:0;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:start;font-size:18px;font-weight:600;color:var(--ink)}
.chev{flex-shrink:0;transition:transform .25s} .qa.open .chev{transform:rotate(180deg)}
.qa-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease} .qa.open .qa-p{grid-template-rows:1fr}
.qa-p>div{overflow:hidden} .qa-p p{padding:0 22px 20px;color:var(--body)}
.rel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.rel-head h2{font-size:32px}
.rel-head a{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--primary);text-decoration:none;min-height:44px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.ccard{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,translate .2s}
.ccard:hover{border-color:var(--primary);translate:0 -3px}
.ccard img{display:block;width:100%;height:auto;aspect-ratio:832/482;object-fit:cover;border-bottom:1px solid var(--line)}
.cbody{padding:20px 24px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.cbody h3{font-size:21px} .cbody h3 a{text-decoration:none;color:inherit} .cbody h3 a::after{content:"";position:absolute;inset:0}
.cbody p{color:var(--body);font-size:16px}
.facts{list-style:none;margin:auto 0 0;padding:0;display:flex;gap:20px;flex-wrap:wrap;font-size:15px;color:#2A3142}
.facts li{display:flex;align-items:center;gap:8px} .facts svg{color:var(--primary)}
.cta{margin:96px 0;background:var(--primary);color:#fff;border-radius:32px;padding:64px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;overflow:hidden}
.cta h2{color:#fff;font-size:clamp(28px,3vw,44px)}
.cta p{color:rgba(255,255,255,.85);max-width:560px}
.cta .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.cta .btn-primary{background:#fff;color:var(--primary)}
.cta .btn-ghost{border:1px solid rgba(255,255,255,.7);color:#fff;background:transparent}
.mbar{display:none}
.vid-dialog{border:0;border-radius:20px;padding:0;width:min(860px,92vw);overflow:hidden}
.vid-dialog::backdrop{background:rgba(8,14,40,.72)}
.vid-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px;padding-inline-start:24px}
.vid-head h3{font-size:18px}
.vid-close{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:#fff;display:flex;align-items:center;justify-content:center}
.vid-frame{aspect-ratio:16/9;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.site-footer{background:#fff;border-top:1px solid var(--line)}
.site-footer{padding-block:96px 40px;overflow:hidden}
.ft-top{display:flex;justify-content:space-between;align-items:flex-start;gap:48px;flex-wrap:wrap}
.ft-brand{display:flex;flex-direction:column;gap:20px;max-width:420px}
.ft-brand .logo svg{height:48px}
.ft-brand p{font-size:20px;color:var(--muted);line-height:1.7}
.ft-contact{display:flex;flex-direction:column;gap:20px;min-width:340px}
.ft-contact a{display:flex;justify-content:space-between;align-items:center;gap:40px;text-decoration:none;color:var(--ink);font-size:32px;font-weight:600}
.ft-contact a:hover{color:var(--primary)}
.ft-contact .ext{flex-shrink:0;width:26px;height:26px;transition:transform .2s}
html[dir="rtl"] .ft-contact a{flex-direction:row}
.ft-contact a:hover .ext{transform:translate(2px,-2px)}
.ft-mid{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap;margin-top:112px}
.ft-links{display:flex;gap:48px;flex-wrap:wrap}
.ft-links a{text-decoration:none;color:var(--ink);font-size:22px;font-weight:600}
.ft-links a:hover{color:var(--primary)}
.ft-social{display:flex;gap:28px}
.ft-social svg{width:52px;height:52px}
.ft-social a{color:var(--primary);display:flex;border-radius:8px}
.ft-social a:hover{opacity:.8}
.ft-mark-wrap{margin-top:72px;direction:ltr;-webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.35) 70%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.35) 70%,transparent 100%)}
.foot-mark{display:block;width:100%;height:auto;color:#E8ECF7}
.ft-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:17px;color:var(--muted)}
.ft-bottom a{color:var(--ink);text-decoration:none}
.ft-bottom a:hover{color:var(--primary)}
html.rv-on .rv{opacity:0;translate:0 24px;transition:opacity .7s cubic-bezier(.2,.7,.2,1),translate .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--rvd,0s)}
html.rv-on .rv.in{opacity:1;translate:0 0}
@media (max-width:1180px){:root{--pad:40px}.nav{display:none}.menu-btn{display:inline-flex}.nav-pill{grid-template-columns:1fr auto}
  .top{grid-template-columns:minmax(0,1fr) 340px}.revs{grid-template-columns:repeat(2,minmax(0,1fr))}.why{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ft-contact a{font-size:24px}
  .ft-social svg{width:44px;height:44px}
  .ft-mid{margin-top:72px}
}
@media (max-width:900px){
  .top{grid-template-columns:minmax(0,1fr)}
  .banner{min-height:0;height:auto}
  .banner img{position:static;height:auto;aspect-ratio:16/10}
  .infos,.revs{grid-template-columns:minmax(0,1fr)}
  .mod ul{grid-template-columns:minmax(0,1fr)}
  .moments{grid-template-columns:repeat(2,minmax(0,1fr))}
  body{padding-bottom:84px}
  .mbar{display:flex;gap:10px;position:fixed;inset-inline:0;bottom:0;z-index:30;padding:12px var(--pad);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);translate:0 110%;transition:translate .3s ease}
  .mbar.show{translate:0 0}
  .mbar .btn{flex:1;height:52px} .mbar .btn-outline{flex:0 0 52px;padding:0}
}
@media (max-width:600px){:root{--pad:20px}body{font-size:16px}.nav-pill{height:60px;padding-inline:18px 8px}.logo svg{height:22px}
  .banner{border-radius:20px}.banner .play{width:64px;height:64px}
  .main{gap:48px;margin-top:48px}.full{margin-top:64px}.full>h2,.rel-head h2{font-size:24px}.sec h2{font-size:24px}
  .mod-btn{padding:14px 16px}.mod ul{padding-inline:16px}.mod-t b{font-size:17px}
  .why,.grid{grid-template-columns:minmax(0,1fr)}
  .side{padding:22px}.cta{padding:44px 22px;border-radius:24px}.cta .btn{width:100%}
  .ft-contact{min-width:0;width:100%}
  .ft-contact a{font-size:20px}
  .ft-links{gap:16px 24px}
  .ft-links a{font-size:17px}
  .ft-social{gap:18px}
  .ft-social svg{width:36px;height:36px}
  .ft-brand p{font-size:17px}
  .ft-mid{margin-top:48px}
  .site-footer{padding-block:56px 24px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

  var CHEV='<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  var WIC=['<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>','<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 10l-2 2 2 2M15 10l2 2-2 2"/>','<circle cx="12" cy="9" r="5"/><path d="M8.5 13.5L7 22l5-3 5 3-1.5-8.5"/>','<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/>'];
  var INFO_IC=['<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 18.5"/></svg>','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 20h20"/></svg>'];
  var CLOCKI='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>', LEVELI='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-5M12 20V10M19 20V4"/></svg>', ARR='<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  function courseUrl(){ var u=(location.origin&&location.origin!=='null')?location.origin+location.pathname:location.href.split('?')[0]; return u+'?id='+id; }
  function render(){
    var t=T[state.lang], c=C[id], L=state.lang==='ar'?0:1;
    document.documentElement.lang=state.lang; document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
    document.title=c.course+' — Route';
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent=t[el.getAttribute('data-t')]; });
    document.querySelectorAll('[data-t-aria]').forEach(function(el){ el.setAttribute('aria-label',t[el.getAttribute('data-t-aria')]); });
    var lb=$('langBtn'); lb.textContent=t.langBtn; lb.setAttribute('lang',state.lang==='ar'?'en':'ar');
    $('crumbCourse').textContent=c.course; $('vidTitle').textContent=c.course;
    $('cTag').innerHTML='<bdi lang="en">'+esc(c.name)+'</bdi>&nbsp;|&nbsp;'+esc(t.courseWord)+'&nbsp;|&nbsp;<bdi>[C00]</bdi>';
    $('cTitle').textContent=c.course; $('cDesc').textContent=c.desc[L];
    $('cStack').innerHTML=c.stack.map(function(s){ return '<span>'+esc(s)+'</span>'; }).join('');
    $('cDur').textContent=c.dur[L]; $('cLvl').textContent=c.lvl[L]; $('cMods').textContent=c.mods.length;
    $('cTopics').textContent=c.mods.reduce(function(a,m){ return a+m[1].length; },0);
    var href='index.html?course='+id+(state.lang==='en'?'&lang=en':'')+'#contact';
    document.querySelectorAll('.enroll').forEach(function(a){ a.href=href; });
    $('modules').innerHTML=c.mods.map(function(m,i){ var o=!!state.open[i];
      return '<div class="mod'+(o?' open':'')+'"><h3><button type="button" class="mod-btn" data-mod="'+i+'" aria-expanded="'+o+'" aria-controls="md'+i+'"><span class="mod-n">'+(i+1)+'</span><span class="mod-t"><small>'+esc(t.stage)+' '+(i+1)+' · '+m[1].length+' '+esc(t.topics)+'</small><b lang="en">'+esc(m[0])+'</b></span>'+CHEV+'</button></h3>'+
        '<div class="mod-p" id="md'+i+'"><div><ul>'+m[1].map(function(x){ return '<li><bdi lang="en">'+esc(x)+'</bdi></li>'; }).join('')+'</ul></div></div></div>'; }).join('');
    syncExpandAll();
    $('revs').innerHTML=t.reviews.map(function(r){ return '<figure class="rev" style="margin:0"><span class="rev-q" aria-hidden="true">“</span><p>'+esc(r[2])+'</p><figcaption class="rev-h"><span class="av" aria-hidden="true">'+esc(r[0].charAt(0))+'</span><div><b>'+esc(r[0])+'</b><small lang="en">'+esc(r[1])+'</small></div></figcaption></figure>'; }).join('');
    $('why').innerHTML=t.why.map(function(w,i){ return '<div><span class="wic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+WIC[i]+'</svg></span><b>'+esc(w[0])+'</b><p>'+esc(w[1])+'</p></div>'; }).join('');
    $('moments').innerHTML=MOMENTS.map(function(src){ return '<img src="'+src+'" alt="'+esc(t.momentAlt)+'" width="560" height="560" loading="lazy" decoding="async">'; }).join('');
    var rel=Object.keys(C).filter(function(k){ return k!==id && C[k].cat===c.cat; }).concat(Object.keys(C).filter(function(k){ return k!==id && C[k].cat!==c.cat; })).slice(0,3);
    $('related').innerHTML=rel.map(function(k){ var r=C[k]; return '<article class="ccard"><img src="'+IMG+'" alt="" width="832" height="482" loading="lazy" decoding="async"><div class="cbody"><span class="tag" style="align-self:flex-start"><bdi lang="en">'+esc(r.name)+'</bdi>&nbsp;|&nbsp;'+esc(t.courseWord)+'</span><h3 lang="en"><a href="course.html?id='+k+'">'+esc(r.course)+'</a></h3><p>'+esc(r.short[L])+'</p><ul class="facts"><li>'+CLOCKI+'<span>'+esc(r.dur[L])+'</span></li><li>'+LEVELI+'<span>'+esc(r.lvl[L])+'</span></li></ul></div></article>'; }).join('');
    renderFaq(); buildShare();
  }
  function syncExpandAll(){ var n=C[id].mods.length, all=true; for(var i=0;i<n;i++) if(!state.open[i]) all=false; var b=$('expandAll'); b.textContent=T[state.lang][all?'collapseAll':'expandAll']; b.dataset.all=all?'1':''; }
  $('modules').addEventListener('click',function(e){ var b=e.target.closest('[data-mod]'); if(!b) return; var i=+b.getAttribute('data-mod'); state.open[i]=!state.open[i];
    var it=b.closest('.mod'); it.classList.toggle('open',!!state.open[i]); b.setAttribute('aria-expanded',!!state.open[i]); syncExpandAll(); });
  $('expandAll').addEventListener('click',function(){ var all=this.dataset.all==='1', n=C[id].mods.length; state.open={}; if(!all) for(var i=0;i<n;i++) state.open[i]=true;
    Array.prototype.forEach.call($('modules').children,function(it,k){ var on=!!state.open[k]; it.classList.toggle('open',on); it.querySelector('.mod-btn').setAttribute('aria-expanded',on); }); syncExpandAll(); });
  function renderFaq(){ var t=T[state.lang];
    $('faqs').innerHTML=t.faqs.map(function(f,i){ var o=state.faq===i; return '<div class="qa'+(o?' open':'')+'"><h3><button type="button" data-q="'+i+'" aria-expanded="'+o+'" aria-controls="fq'+i+'"><span>'+esc(f[0])+'</span>'+CHEV+'</button></h3><div class="qa-p" id="fq'+i+'"><div><p>'+esc(f[1])+'</p></div></div></div>'; }).join(''); }
  $('faqs').addEventListener('click',function(e){ var b=e.target.closest('[data-q]'); if(!b) return; var i=+b.getAttribute('data-q'); state.faq=state.faq===i?-1:i;
    Array.prototype.forEach.call($('faqs').children,function(it,k){ var on=state.faq===k; it.classList.toggle('open',on); it.querySelector('button').setAttribute('aria-expanded',on); }); });
  // share
  var ICONS={wa:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.4z"/></svg>',
    fb:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H8v4h2v8h4v-8h3l1-4h-4V8z"/></svg>',
    li:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h4v4H4zM4 10h4v10H4zM10 10h4v1.5c.6-1 1.8-1.8 3.5-1.8 3 0 3.5 2 3.5 4.6V20h-4v-5c0-1.2 0-2.6-1.6-2.6S13.9 13.6 13.9 15v5H10z"/></svg>',
    x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 3h3.2l-7 8 8.3 10h-6.5l-5-6.2L4.6 21H1.4l7.5-8.6L1 3h6.7l4.5 5.7zm-1.1 16h1.8L6.7 4.9H4.8z"/></svg>',
    tg:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.5 3.5L2.8 10.7c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.2-15c.3-1.3-.5-1.9-1.5-1.3z"/></svg>',
    cp:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'};
  function buildShare(){
    var t=T[state.lang], url=encodeURIComponent(courseUrl()), txt=encodeURIComponent(t.shareText+': '+C[id].course);
    var items=[['wa','WhatsApp','https://wa.me/?text='+txt+'%20'+url],['fb','Facebook','https://www.facebook.com/sharer/sharer.php?u='+url],['li','LinkedIn','https://www.linkedin.com/sharing/share-offsite/?url='+url],['x','X','https://twitter.com/intent/tweet?text='+txt+'&url='+url],['tg','Telegram','https://t.me/share/url?url='+url+'&text='+txt]];
    $('sharePop').innerHTML='<button type="button" role="menuitem" id="copyLink">'+ICONS.cp+'<span>'+esc(t.copy)+'</span></button>'+items.map(function(it){ return '<a role="menuitem" href="'+it[2]+'" target="_blank" rel="noopener">'+ICONS[it[0]]+'<span>'+esc(t.shareOn)+' '+it[1]+'</span></a>'; }).join('');
  }
  function toast(msg){ var el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(function(){ el.classList.remove('show'); },2200); }
  function copy(){ var u=courseUrl(); function done(){ toast(T[state.lang].copied); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(u).then(done,function(){ fallback(); }); } else fallback();
    function fallback(){ var ta=document.createElement('textarea'); ta.value=u; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} ta.remove(); } }
  var pop=$('sharePop'), popBtn=document.querySelector('.share-wrap .share-btn');
  function closePop(){ pop.classList.remove('open'); popBtn.setAttribute('aria-expanded','false'); }
  document.addEventListener('click',function(e){
    var sb=e.target.closest('.share-btn');
    if(sb){
      var t=T[state.lang];
      if(navigator.share && window.matchMedia('(pointer:coarse)').matches){ navigator.share({title:C[id].course+' — Route', text:t.shareText, url:courseUrl()}).catch(function(){}); return; }
      if(sb.closest('.mbar')){ copy(); return; }
      var open=!pop.classList.contains('open'); pop.classList.toggle('open',open); popBtn.setAttribute('aria-expanded',open); return;
    }
    if(e.target.closest('#copyLink')){ copy(); closePop(); return; }
    if(!e.target.closest('#sharePop')) closePop();
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closePop(); });

  // intro video
  var dlg=$('vidDialog');
  $('playBtn').addEventListener('click',function(){ var v=INTRO_VIDEOS[id]||{}, f=dlg.querySelector('.vid-frame');
    if(v.youtube) f.innerHTML='<iframe style="width:100%;height:100%;border:0" src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.youtube)+'?autoplay=1" title="'+esc(C[id].course)+'" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
    else if(v.mp4) f.innerHTML='<video style="width:100%;height:100%" src="'+v.mp4+'" controls autoplay playsinline></video>';
    else f.textContent=T[state.lang].videoSoon;
    dlg.showModal ? dlg.showModal() : dlg.setAttribute('open',''); });
  $('vidClose').addEventListener('click',function(){ dlg.close(); });
  dlg.addEventListener('close',function(){ var f=dlg.querySelector('.vid-frame'); if(f.querySelector('iframe,video')) f.textContent=''; });
  dlg.addEventListener('click',function(e){ if(e.target===dlg) dlg.close(); });

  // nav + lang
  $('langBtn').addEventListener('click',function(){ state.lang=state.lang==='ar'?'en':'ar'; try{ localStorage.setItem('route-lang',state.lang); }catch(e){} render(); });
  $('menuBtn').addEventListener('click',function(){ var n=$('mobileNav'), o=!n.classList.contains('open'); n.classList.toggle('open',o); this.setAttribute('aria-expanded',o); });

  // mobile bottom bar: show only when the enroll card is off screen
  if('IntersectionObserver' in window){
    var bar=document.querySelector('.mbar');
    new IntersectionObserver(function(es){ es.forEach(function(e){ bar.classList.toggle('show', !e.isIntersecting); }); },{threshold:0}).observe(document.querySelector('.side-actions'));
  }


  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce && 'IntersectionObserver' in window){ document.documentElement.classList.add('rv-on');
    var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); },{threshold:.06});
    document.querySelectorAll('.rv, .ft-top, .ft-mid, .ft-mark-wrap').forEach(function(el){ el.classList.add('rv'); io.observe(el); });
    window.addEventListener('scroll',function(){ if(innerHeight+scrollY>=document.documentElement.scrollHeight-8) document.querySelectorAll('.rv:not(.in)').forEach(function(el){ el.classList.add('in'); }); },{passive:true}); }
  render();
})();
</script>
