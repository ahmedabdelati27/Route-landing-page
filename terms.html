<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الشروط والأحكام — Route</title>
<meta name="description" content="الشروط والأحكام الخاصة باستخدام موقع Route Academy والتسجيل في الكورسات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light;--primary:#00298E;--primary-deep:#001F6B;--cyan:#1AA0DB;--cyan-ink:#0A6FA3;--cyan-soft:#E6F4FB;--ink:#0E1320;--body:#4A5366;--muted:#5A6378;--line:#E4E7EE;--line-2:#D5DAE4;--soft:#EEF3FF;--alt:#E9F4FF;--alt-line:#D3E6FA;--bg:#FFFFFF;
  --font:'IBM Plex Sans Arabic','Urbanist',Tahoma,'Segoe UI',sans-serif;--pad:80px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang="en"]{--font:'Urbanist','IBM Plex Sans Arabic','Segoe UI',Helvetica,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit} button{font:inherit;cursor:pointer} p{margin:0} h1,h2,h3{margin:0;font-weight:600;line-height:1.3}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{max-width:1440px;margin-inline:auto;padding-inline:var(--pad)}
.arrow{width:20px;height:20px;flex-shrink:0} html[dir="rtl"] .arrow{transform:scaleX(-1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding-inline:28px;border-radius:999px;font-size:17px;font-weight:600;text-decoration:none;white-space:nowrap;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-deep)}
.btn-outline{border-color:var(--primary);color:var(--primary);background:#fff}.btn-outline:hover{background:var(--soft)}
.btn-sm{height:44px;padding-inline:20px;font-size:15px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* header: full-width at top, shrinks into a floating pill on scroll */
.site-header{position:sticky;top:0;z-index:20;padding:12px var(--pad) 0;margin-bottom:-96px;pointer-events:none}
.nav-pill{pointer-events:auto;max-width:1280px;margin:0 auto;height:84px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding-inline:0;background:transparent;border:1px solid transparent;border-radius:999px;transition:max-width .45s cubic-bezier(.2,.7,.2,1),height .35s,padding .35s,background .35s,border-color .35s,margin .35s}
.site-header.scrolled .nav-pill{max-width:960px;height:68px;padding-inline:28px 8px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.logo{justify-self:start;display:flex;align-items:center;color:var(--primary);text-decoration:none;min-height:44px}
.logo svg{display:block;height:30px;width:auto;transition:height .35s}
.site-header.scrolled .logo svg{height:24px}
.nav{display:flex;gap:32px;font-size:16px;font-weight:500}
.nav a{text-decoration:none;color:var(--ink);padding-block:10px;white-space:nowrap;position:relative;transition:color .2s}
.nav a:hover,.nav a.active{color:var(--primary)}
.nav a::after{content:"";position:absolute;inset-inline:0;bottom:2px;height:2px;border-radius:2px;background:var(--primary);transform:scaleX(0);transition:transform .25s}
.nav a.active::after{transform:scaleX(1)}
.site-header.scrolled .nav{gap:26px;font-size:15px}
.actions{justify-self:end;display:flex;align-items:center;gap:8px}
.site-header.scrolled .login{display:none}
.lang{height:44px;padding-inline:14px;border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:14px;font-weight:600}
.lang:hover{border-color:var(--primary);color:var(--primary)}
.login{text-decoration:none;font-size:15px;padding-inline:12px;height:44px;display:flex;align-items:center}
.site-header.scrolled .btn-sm{height:50px;padding-inline:24px}
.menu-btn{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:#fff;color:var(--ink);align-items:center;justify-content:center}
.mobile-nav{pointer-events:auto;display:none;position:absolute;top:100%;left:var(--pad);right:var(--pad);max-width:1280px;margin:8px auto 0;padding:12px 20px;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:24px}
.mobile-nav a{min-height:48px;display:flex;align-items:center;text-decoration:none;font-size:17px}
.mobile-nav.open{display:flex}
.site-header.sub{margin-bottom:0}




.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:28px 0 0;padding:0;list-style:none}
.crumbs a{text-decoration:none;color:var(--muted)} .crumbs a:hover{color:var(--primary)}
.crumbs li+li::before{content:"/";margin-inline-end:8px;color:var(--line-2)}
.crumbs [aria-current]{color:var(--ink);font-weight:600}
.lhead{padding:48px 0 40px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.eyebrow{padding:6px 16px;border-radius:999px;background:var(--cyan-soft);color:var(--cyan-ink);font-size:14px;font-weight:600;transform:rotate(-4deg)}
html[dir="rtl"] .eyebrow{transform:rotate(4deg)}
.lhead h1{font-size:clamp(34px,4vw,56px)}
.lhead .upd{color:var(--muted);font-size:15px}
.lhead .intro{font-size:19px;color:var(--body);max-width:820px;line-height:1.8}
.ldoc{display:grid;grid-template-columns:280px minmax(0,1fr);gap:64px;padding:48px 0 96px;align-items:start}
.toc{position:sticky;top:110px}
.toc b{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:12px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;border-inline-start:2px solid var(--line)}
.toc a{display:block;padding:8px 16px;margin-inline-start:-2px;border-inline-start:2px solid transparent;text-decoration:none;color:var(--body);font-size:15px;line-height:1.5}
.toc a:hover{color:var(--primary)}
.toc a.active{color:var(--primary);border-inline-start-color:var(--primary);font-weight:600}
.also{margin-top:28px;padding:18px;border-radius:18px;background:var(--alt)}
.also small{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.also a{color:var(--primary);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.content{max-width:820px;display:flex;flex-direction:column;gap:40px}
.content section h2{font-size:24px;display:flex;gap:12px;align-items:baseline;margin-bottom:12px}
.content section h2 span{color:var(--primary);font-size:18px;min-width:28px}
.content ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;padding-inline-start:40px}
.content li{position:relative;padding-inline-start:18px;font-size:17px;line-height:1.85;color:#2A3142}
.content li::before{content:"";position:absolute;inset-inline-start:0;top:.8em;width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.content li.single{padding-inline-start:0}.content li.single::before{display:none}
.site-footer{background:#fff;border-top:1px solid var(--line)}
.site-footer{padding-block:96px 40px;overflow:hidden}
.ft-top{display:flex;justify-content:space-between;align-items:flex-start;gap:48px;flex-wrap:wrap}
.ft-brand{display:flex;flex-direction:column;gap:20px;max-width:420px}
.ft-brand .logo svg{height:48px}
.ft-brand p{font-size:20px;color:var(--muted);line-height:1.7}
.ft-contact{display:flex;flex-direction:column;gap:20px;min-width:340px}
.ft-contact a{display:flex;justify-content:space-between;align-items:center;gap:40px;text-decoration:none;color:var(--ink);font-size:32px;font-weight:600}
.ft-contact a:hover{color:var(--primary)}
.ft-contact .ext{flex-shrink:0;width:26px;height:26px;transition:transform .2s}
html[dir="rtl"] .ft-contact a{flex-direction:row}
.ft-contact a:hover .ext{transform:translate(2px,-2px)}
.ft-mid{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap;margin-top:112px}
.ft-links{display:flex;gap:48px;flex-wrap:wrap}
.ft-links a{text-decoration:none;color:var(--ink);font-size:22px;font-weight:600}
.ft-links a:hover{color:var(--primary)}
.ft-social{display:flex;gap:28px}
.ft-social svg{width:52px;height:52px}
.ft-social a{color:var(--primary);display:flex;border-radius:8px}
.ft-social a:hover{opacity:.8}
.ft-mark-wrap{margin-top:72px;direction:ltr;-webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.35) 70%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.35) 70%,transparent 100%)}
.foot-mark{display:block;width:100%;height:auto;color:#E8ECF7}
.ft-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:17px;color:var(--muted)}
.ft-bottom a{color:var(--ink);text-decoration:none}
.ft-bottom a:hover{color:var(--primary)}
.ft-legal{display:flex;gap:24px;flex-wrap:wrap}
@media (max-width:1180px){:root{--pad:40px}
  .nav{display:none}
  .nav-pill{grid-template-columns:1fr auto}
  .menu-btn{display:inline-flex}
  .login{display:none}
.ldoc{grid-template-columns:220px minmax(0,1fr);gap:40px}
  .ft-contact a{font-size:24px}
  .ft-social svg{width:44px;height:44px}
  .ft-mid{margin-top:72px}
}
@media (max-width:900px){.ldoc{grid-template-columns:minmax(0,1fr)}.toc{position:static;padding:20px;border:1px solid var(--line);border-radius:18px}}
@media (max-width:600px){:root{--pad:20px}body{font-size:16px}
  .logo svg{height:24px}
  .nav-pill{height:64px}
  .site-header{padding-top:8px}
  .site-header.scrolled .nav-pill{height:60px;padding-inline:18px 8px}
  .actions .btn-sm{display:none}
.content ul{padding-inline-start:0}.content li{font-size:16px}.lhead .intro{font-size:17px}
  .ft-contact{min-width:0;width:100%}
  .ft-contact a{font-size:20px}
  .ft-links{gap:16px 24px}
  .ft-links a{font-size:17px}
  .ft-social{gap:18px}
  .ft-social svg{width:36px;height:36px}
  .ft-brand p{font-size:17px}
  .ft-mid{margin-top:48px}
  .site-footer{padding-block:56px 24px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

(function(){
  var T={"ar": {"langBtn": "English", "menu": "القائمة", "navHome": "الرئيسية", "navTracks": "الكورسات", "navHow": "إزاي بنعلّم", "navStories": "قصص الخريجين", "navBlog": "المدونة", "login": "تسجيل الدخول", "start": "ابدأ دلوقتي", "crumbHome": "الرئيسية", "eyebrow": "قانوني", "updated": "آخر تحديث: 27 سبتمبر 2026", "toc": "المحتوى", "also": "اقرأ كمان", "footAbout": "Route أكاديمية لتعليم البرمجة، بتاخدك من أول 0 لحد أول وظيفة في المجال.", "contactEyebrow": "تواصل معانا", "rights": "© 2026 Route. كل الحقوق محفوظة.", "terms": "الشروط والأحكام", "privacy": "سياسة الخصوصية"}, "en": {"langBtn": "العربية", "menu": "Menu", "navHome": "Home", "navTracks": "Courses", "navHow": "How we teach", "navStories": "Graduate stories", "navBlog": "Blog", "login": "Log in", "start": "Get started", "crumbHome": "Home", "eyebrow": "Legal", "updated": "Last updated: September 27, 2026", "toc": "Contents", "also": "Also read", "footAbout": "Route is a coding academy that takes you from your first 0 to your first job in tech.", "contactEyebrow": "Contact us", "rights": "© 2026 Route. All rights reserved.", "terms": "Terms of Service", "privacy": "Privacy Policy"}}, D={"ar": {"title": "الشروط والأحكام", "intro": "مرحبًا بك في Route Academy. تنظّم هذه الشروط استخدامك لموقعنا وتسجيلك في الكورسات التي نقدمها. باستخدامك للموقع أو التسجيل في أي كورس، فإنك توافق على هذه الشروط، فيُرجى قراءتها بعناية.", "secs": [["عن خدماتنا", ["تقدم Route كورسات تدريبية في مجالات البرمجة والتكنولوجيا، أونلاين وفي فروعنا، وفقًا للمواعيد والتفاصيل المعلنة لكل كورس ودفعة.", "قد نقوم بتعديل محتوى الكورسات أو مواعيدها أو المدربين عند الحاجة، بما يحافظ على جودة التجربة التعليمية."]], ["التسجيل", ["يجب أن تكون البيانات التي تقدمها عند التسجيل صحيحة وكاملة، وأن تقوم بتحديثها عند تغيّرها.", "إذا كان عمرك أقل من 18 سنة، يجب أن يتم تسجيلك بموافقة ولي أمرك.", "يُعد تسجيلك مكتملًا بعد تأكيده من Route وسداد الرسوم المطلوبة أو الدفعة الأولى وفقًا لطريقة الدفع المتفق عليها."]], ["الرسوم والدفع", ["تُحدد رسوم كل كورس على صفحته أو من خلال فريقنا، وقد تتغير الأسعار دون أن يؤثر ذلك على من أتم تسجيله بالفعل.", "في حالة الدفع بالتقسيط، يلتزم الطالب بسداد الأقساط في مواعيدها المتفق عليها، ويجوز لـ Route إيقاف الاشتراك مؤقتًا عند التأخر في السداد."]], ["الاسترداد والتأجيل", ["[سياسة استرداد الرسوم: الحالات والمدد المسموح فيها بالاسترداد.]", "[سياسة التأجيل أو الانتقال إلى دفعة أخرى وشروطها.]"]], ["الالتزام وسلوك الطلاب", ["يلتزم الطالب بحضور المحاضرات وتسليم المشاريع في مواعيدها للحصول على أفضل استفادة.", "يُمنع أي سلوك مسيء تجاه المدربين أو الزملاء أو فريق العمل، ويحق لـ Route إنهاء اشتراك من يخالف ذلك.", "يُمنع مشاركة بيانات الدخول إلى المنصات أو المحاضرات مع أي شخص آخر."]], ["الشهادات", ["تُمنح شهادة Route بعد استكمال متطلبات الكورس، بما في ذلك الحضور وتسليم المشاريع المطلوبة."]], ["الملكية الفكرية", ["جميع المواد التعليمية والمحتوى والشعارات والتصميمات الخاصة بـ Route مملوكة لها، ولا يجوز نسخها أو نشرها أو بيعها دون إذن كتابي.", "المشاريع التي تنفذها خلال الكورس ملك لك، ويجوز لـ Route عرضها كأمثلة على أعمال طلابها بعد موافقتك."]], ["المحتوى المنشور", ["عند موافقتك على نشر رأيك أو صورتك أو قصة نجاحك، فإنك تمنح Route الحق في عرضها على الموقع ومنصات التواصل الاجتماعي، ويمكنك طلب إزالتها في أي وقت."]], ["دعم التوظيف وحدود المسؤولية", ["تقدم Route دعمًا في إعداد السيرة الذاتية والـ Portfolio والتجهيز للمقابلات، وقد ترشّح الطلاب المتميزين لشركاء التوظيف، إلا أن ذلك لا يُعد ضمانًا للحصول على وظيفة.", "لا تتحمل Route مسؤولية أي أضرار غير مباشرة ناتجة عن استخدام الموقع أو الخدمات، في حدود ما يسمح به القانون."]], ["الروابط الخارجية", ["قد يحتوي الموقع على روابط لمواقع أو منصات أخرى، ولا تتحمل Route مسؤولية محتواها أو سياساتها."]], ["التعديلات", ["قد نقوم بتحديث هذه الشروط من وقت لآخر، وسيظهر تاريخ آخر تحديث أعلى الصفحة. استمرارك في استخدام الموقع أو الخدمات بعد التحديث يعني موافقتك على الشروط المعدّلة."]], ["القانون المطبق", ["تخضع هذه الشروط لقوانين جمهورية مصر العربية، وتختص المحاكم المصرية بالنظر في أي نزاع ينشأ عنها."]], ["تواصل معنا", ["للتواصل معنا بخصوص هذه الشروط أو أي استفسار: هاتف وواتساب 01023639954، أو البريد الإلكتروني [email@route]."]]]}, "en": {"title": "Terms of Service", "intro": "Welcome to Route Academy. These terms govern your use of our website and your enrollment in our courses. By using the website or enrolling in any course, you agree to these terms, so please read them carefully.", "secs": [["Our services", ["Route offers training courses in programming and technology, online and at our branches, according to the dates and details announced for each course and cohort.", "We may adjust course content, schedules or instructors when needed, while keeping the quality of the learning experience."]], ["Enrollment", ["The information you provide when enrolling must be accurate and complete, and you should update it if it changes.", "If you are under 18, you must enroll with your parent or guardian’s consent.", "Your enrollment is complete once Route confirms it and the required fee, or first installment, is paid under the agreed payment method."]], ["Fees and payment", ["The fee for each course is shown on its page or shared by our team. Prices may change without affecting students who have already enrolled.", "If you pay in installments, you must pay each installment on its agreed date. Route may pause access in case of late payment."]], ["Refunds and deferrals", ["[Refund policy: when refunds are allowed and within what period.]", "[Policy and conditions for deferring or moving to another cohort.]"]], ["Commitment and conduct", ["Students are expected to attend sessions and submit projects on time to get the most out of the course.", "Abusive behavior toward instructors, classmates or staff is not allowed, and Route may end the enrollment of anyone who breaks this rule.", "Sharing your login details for our platforms or sessions with anyone else is not allowed."]], ["Certificates", ["The Route certificate is awarded after completing the course requirements, including attendance and required projects."]], ["Intellectual property", ["All learning materials, content, logos and designs belonging to Route are its property and may not be copied, published or sold without written permission.", "Projects you build during the course belong to you. Route may showcase them as examples of student work with your consent."]], ["Published content", ["When you agree to share your review, photo or success story, you give Route the right to display it on the website and social media. You can ask us to remove it at any time."]], ["Career support and liability", ["Route offers help with your CV, portfolio and interview preparation, and may refer top students to hiring partners, but this is not a guarantee of employment.", "To the extent permitted by law, Route is not liable for indirect damages arising from the use of the website or services."]], ["External links", ["The website may contain links to other websites or platforms. Route is not responsible for their content or policies."]], ["Changes", ["We may update these terms from time to time, and the last updated date will appear at the top of this page. Continuing to use the website or services after an update means you accept the updated terms."]], ["Governing law", ["These terms are governed by the laws of the Arab Republic of Egypt, and Egyptian courts have jurisdiction over any dispute arising from them."]], ["Contact us", ["To contact us about these terms or any question: phone and WhatsApp 01023639954, or email [email@route]."]]]}};
